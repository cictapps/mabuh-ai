<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#121416" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Mabuh-ai</title>
    <style>
      /* Critical splash styles prevent the 1024px SVG from flashing at its
         intrinsic size before the application stylesheet has loaded. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        box-sizing: border-box;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        overflow: hidden;
        background: #121416;
        color: #eef1f6;
      }

      #splash .splash-logo {
        display: block;
        width: 76px;
        height: 76px;
        object-fit: contain;
      }

      #splash .splash-wordmark {
        margin: 0;
        font-family: ui-serif, Georgia, serif;
        font-size: 20px;
        line-height: 1.2;
      }

      #splash .splash-status {
        margin: 0;
        font:
          600 9px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(216, 212, 235, 0.55);
      }
    </style>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-glow splash-glow--amber"></div>
      <div class="splash-glow splash-glow--lilac"></div>
      <img class="splash-logo" src="/app-logo.svg" width="76" height="76" alt="" />
      <p class="splash-wordmark">Mabuh-ai</p>
      <p class="splash-status">A gentle space for you</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
