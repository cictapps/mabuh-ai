<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#121416" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Mabuh-ai</title>
    <style>
      /* Critical splash styles prevent the 1024px SVG from flashing at its
         intrinsic size before the application stylesheet has loaded. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        box-sizing: border-box;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        overflow: hidden;
        background: #121416;
        color: #eef1f6;
      }

      #splash .splash-logo {
        display: block;
        width: 76px;
        height: 76px;
        object-fit: contain;
      }

      #splash .splash-wordmark {
        margin: 0;
        font-family: ui-serif, Georgia, serif;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.01em;
        line-height: 1.2;
        color: rgba(238, 241, 246, 0.95);
        background-image: linear-gradient(
          90deg,
          rgba(188, 194, 255, 0.55) 0%,
          rgba(238, 241, 246, 1) 30%,
          rgba(255, 220, 180, 0.95) 50%,
          rgba(212, 187, 255, 1) 70%,
          rgba(188, 194, 255, 0.55) 100%
        );
        background-size: 220% 100%;
        background-position: 100% 50%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: splash-shimmer 2.6s ease-in-out infinite;
      }

      #splash .splash-status {
        margin: 2px 0 0;
        font:
          600 9px/1.2 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(216, 212, 235, 0.6);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        animation: splash-status-breathe 2.2s ease-in-out infinite;
      }

      #splash .splash-dots {
        display: inline-flex;
        gap: 3px;
        align-items: center;
      }

      #splash .splash-dots span {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(188, 194, 255, 0.85);
        animation: splash-dot 1.2s ease-in-out infinite;
      }

      #splash .splash-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      #splash .splash-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes splash-shimmer {
        0%,
        100% {
          background-position: 100% 50%;
        }
        50% {
          background-position: 0% 50%;
        }
      }

      @keyframes splash-status-breathe {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 0.95;
        }
      }

      @keyframes splash-dot {
        0%,
        80%,
        100% {
          transform: scale(0.7);
          opacity: 0.35;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash .splash-wordmark {
          animation: none;
          background: none;
          -webkit-text-fill-color: currentColor;
          color: rgba(238, 241, 246, 0.95);
        }
        #splash .splash-status,
        #splash .splash-dots span {
          animation: none;
        }
        #splash .splash-dots span {
          opacity: 0.7;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-glow splash-glow--amber"></div>
      <div class="splash-glow splash-glow--lilac"></div>
      <img class="splash-logo" src="/app-logo.svg" width="76" height="76" alt="" />
      <p class="splash-wordmark">Mabuh-ai</p>
      <p class="splash-status" aria-label="By students, for students. Loading.">
        <span>By students, for students</span>
        <span class="splash-dots" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
